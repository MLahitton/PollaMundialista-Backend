spring.application.name=MundialBackend

# Carga la configuracion local desde .env (ignorado por Git) si el archivo existe.
# Ahi viven los secretos de desarrollo; nunca en este archivo, que si va a Git.
# Las variables de entorno del sistema, si existen, tienen prioridad sobre .env.
spring.config.import=optional:file:./.env[.properties]

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/polla_mundialista}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=true

app.auth.google.client-id=${GOOGLE_CLIENT_ID:534418374824-dbaofii13k8ij7mi41o04vvau06hg5kh.apps.googleusercontent.com}
app.auth.jwt.secret=${JWT_SECRET:}
app.auth.jwt.issuer=${JWT_ISSUER:mundial-polla}
app.auth.jwt.audience=${JWT_AUDIENCE:mundial-polla-api}
app.auth.jwt.ttl=${JWT_TTL:PT8H}

# Solo el frontend local por defecto. Para probar desde otro dispositivo
# (por ejemplo un movil en la misma red), define CORS_ALLOWED_ORIGINS en tu
# .env con tu propia IP. Nunca fijes aqui la IP de una maquina concreta.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.scoring.auto.enabled=${AUTO_SCORING_ENABLED:true}
app.scoring.auto.fixed-delay=${AUTO_SCORING_FIXED_DELAY:PT1M}

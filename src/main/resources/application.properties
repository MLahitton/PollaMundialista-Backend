spring.application.name=MundialBackend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/polla_mundialista}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=true

app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.jwt.secret=${JWT_SECRET:}
app.auth.jwt.issuer=${JWT_ISSUER:mundial-polla}
app.auth.jwt.audience=${JWT_AUDIENCE:mundial-polla-api}
app.auth.jwt.ttl=${JWT_TTL:PT8H}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.scoring.auto.enabled=${AUTO_SCORING_ENABLED:true}
app.scoring.auto.fixed-delay=${AUTO_SCORING_FIXED_DELAY:PT1M}
